[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babyactionlm"
version = "0.1.0"
description = "BabyLM-scale mobile tool-call parsing experiments."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --basetemp=outputs/pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
